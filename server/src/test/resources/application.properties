spring.application.name=uncross-server
server.port=8080
# How often live market data is pushed to browsers (ms). 100 ms = at most 10 book updates/s per stock.
uncross.stream.flush-ms=100
# Tests need a quiet market: no bots trading behind their backs.
uncross.bots.enabled=false
# No journal (tests start from nothing) and no surprise news stories.
uncross.journal.enabled=false
uncross.news.enabled=false
