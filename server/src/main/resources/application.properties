spring.application.name=dalalx-server
server.port=8080
# How often live market data is pushed to browsers (ms). 100 ms = at most 10 book updates/s per stock.
dalalx.stream.flush-ms=100
# Simulated traders: on by default; tick = how often the bot thread wakes (ms).
dalalx.bots.enabled=true
dalalx.bots.tick-ms=250
