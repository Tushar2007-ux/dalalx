spring.application.name=uncross-server
server.port=8080
# How often live market data is pushed to browsers (ms). 100 ms = at most 10 book updates/s per stock.
uncross.stream.flush-ms=100
# Simulated traders: on by default; tick = how often the bot thread wakes (ms).
uncross.bots.enabled=true
uncross.bots.tick-ms=250
# The journal: every command is written to data/journal, and replayed on start-up to recover the day.
uncross.journal.enabled=true
uncross.journal.dir=data/journal
# Simulated company news: a story every 60-150 s (switchable from the Tools menu).
uncross.news.enabled=true
uncross.news.min-gap-seconds=60
uncross.news.max-gap-seconds=150
