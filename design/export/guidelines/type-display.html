<!doctype html>
<html><head><meta charset="utf-8"><title>Display</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:0;font-family:var(--font-ui)}
.cap{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted)}
.lbl{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
</style></head><body>
<div data-edition="day" class="dx-paper" style="padding:16px 20px;display:grid;gap:10px">
  <div style="display:flex;align-items:baseline;gap:16px"><span style="font-family:var(--font-display);font-weight:800;font-size:72px;line-height:1;letter-spacing:-.02em;font-variation-settings:'opsz' 144">DalalX</span><span class="cap">masthead · 800 · 72/72 · opsz 144 · −0.02em</span></div>
  <div style="display:grid;grid-template-columns:1fr 170px;gap:12px;align-items:baseline"><span style="font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.1;font-variation-settings:'opsz' 72">Panic Seller dumps 12,000 RELNC</span><span class="cap">headline · 700 · 28/31</span></div>
  <div style="display:grid;grid-template-columns:1fr 170px;gap:12px;align-items:baseline"><span style="font-family:var(--font-display);font-weight:600;font-size:20px">The Munim</span><span class="cap">title / byline · 600 · 20</span></div>
  <div style="display:grid;grid-template-columns:1fr 170px;gap:12px;align-items:baseline"><span style="font-family:var(--font-display);font-style:italic;font-size:15px;color:var(--ink-muted)">The Munim widened his quotes twice before the print.</span><span class="cap">deck / quote · italic 400 · 15</span></div></div>
</body></html>
