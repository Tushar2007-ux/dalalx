<!-- @dsCard group="Spacing" viewport="700x230" name="Rules & column grid" subtitle="Hairline column rules, bold panel heads, double masthead rule" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Rules</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:0;font-family:var(--font-ui)}
.cap{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted)}
.lbl{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
</style></head><body>
<div data-edition="day" class="dx-paper" style="padding:16px 20px;display:grid;gap:14px">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
   <div style="display:grid;gap:6px"><div style="border-top:1px solid var(--rule)"></div><span class="cap">hair · rows, columns</span></div><div style="display:grid;gap:6px"><div style="border-top:1px dotted var(--rule)"></div><span class="cap">dotted · tape rows</span></div><div style="display:grid;gap:6px"><div style="border-top:2px solid var(--rule-strong)"></div><span class="cap">bold · panel head</span></div><div style="display:grid;gap:6px"><div style="border-top:4px double var(--rule-strong)"></div><span class="cap">double · dateline, modal</span></div>
  </div>
  <div style="display:grid;grid-template-columns:1.2fr 1fr 1fr">
   <div style="padding:0 10px;padding-left:0;"><div class="lbl" style="border-top:2px solid var(--rule-strong);padding-top:6px">Markets</div><div style="height:8px;margin-top:8px;background:var(--surface-sunk)"></div><div style="height:8px;margin-top:8px;background:var(--surface-sunk)"></div><div style="height:8px;margin-top:8px;background:var(--surface-sunk)"></div></div><div style="padding:0 10px;border-left:1px solid var(--rule);"><div class="lbl" style="border-top:2px solid var(--rule-strong);padding-top:6px">Order Book</div><div style="height:8px;margin-top:8px;background:var(--surface-sunk)"></div><div style="height:8px;margin-top:8px;background:var(--surface-sunk)"></div><div style="height:8px;margin-top:8px;background:var(--surface-sunk)"></div></div><div style="padding:0 10px;border-left:1px solid var(--rule);"><div class="lbl" style="border-top:2px solid var(--rule-strong);padding-top:6px">Trade Tape</div><div style="height:8px;margin-top:8px;background:var(--surface-sunk)"></div><div style="height:8px;margin-top:8px;background:var(--surface-sunk)"></div><div style="height:8px;margin-top:8px;background:var(--surface-sunk)"></div></div>
  </div><span class="cap">gutter 20px, rule centred in it · radius 0 everywhere except stamps (3px)</span></div>
</body></html>
