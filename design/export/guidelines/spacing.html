<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing & sizing" subtitle="4px base; dense rows for book and tape" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:0;font-family:var(--font-ui)}
.cap{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted)}
.lbl{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
</style></head><body>
<div data-edition="day" class="dx-paper" style="padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:24px">
  <div style="display:grid;gap:5px"><div style="display:flex;gap:10px;align-items:center"><span class="cap" style="width:64px">--space-1</span><span style="height:8px;width:var(--space-1);background:var(--ink)"></span></div><div style="display:flex;gap:10px;align-items:center"><span class="cap" style="width:64px">--space-2</span><span style="height:8px;width:var(--space-2);background:var(--ink)"></span></div><div style="display:flex;gap:10px;align-items:center"><span class="cap" style="width:64px">--space-3</span><span style="height:8px;width:var(--space-3);background:var(--ink)"></span></div><div style="display:flex;gap:10px;align-items:center"><span class="cap" style="width:64px">--space-4</span><span style="height:8px;width:var(--space-4);background:var(--ink)"></span></div><div style="display:flex;gap:10px;align-items:center"><span class="cap" style="width:64px">--space-5</span><span style="height:8px;width:var(--space-5);background:var(--ink)"></span></div><div style="display:flex;gap:10px;align-items:center"><span class="cap" style="width:64px">--space-6</span><span style="height:8px;width:var(--space-6);background:var(--ink)"></span></div><div style="display:flex;gap:10px;align-items:center"><span class="cap" style="width:64px">--space-7</span><span style="height:8px;width:var(--space-7);background:var(--ink)"></span></div></div>
  <div class="cap" style="display:grid;gap:6px;align-content:start;font-size:12px"><div style="border-bottom:1px solid var(--rule);padding-bottom:4px">--row-book 24px</div><div style="border-bottom:1px solid var(--rule);padding-bottom:4px">--row-tape 22px</div><div style="border-bottom:1px solid var(--rule);padding-bottom:4px">--control-h 36px · sm 28px</div><div style="border-bottom:1px solid var(--rule);padding-bottom:4px">side toggle 40px</div><div style="border-bottom:1px solid var(--rule);padding-bottom:4px">avatar head crop < 48px</div><div style="border-bottom:1px solid var(--rule);padding-bottom:4px">column min 240px</div></div></div>
</body></html>
