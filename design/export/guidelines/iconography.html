<!-- @dsCard group="Brand" viewport="700x170" name="Glyphs" subtitle="Unicode typographic glyphs instead of an icon set" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Glyphs</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:0;font-family:var(--font-ui)}
.cap{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted)}
.lbl{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
</style></head><body>
<div data-edition="day" class="dx-paper" style="padding:16px 20px;display:grid;grid-template-columns:repeat(7,1fr);gap:12px"><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--buy)">▲</span><span class="cap">buy / up</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--sell)">▼</span><span class="cap">sell / down</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--buy)">●</span><span class="cap">open / trading</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--stamp)">■</span><span class="cap">halted</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--pencil-text)">◆</span><span class="cap">flagged</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--pencil-text)">✎</span><span class="cap">pencil note</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--ink-muted)">✂</span><span class="cap">clipped notice</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--ink)">§</span><span class="cap">market notice</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--ink)">¶</span><span class="cap">exchange notice</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--buy)">✓</span><span class="cap">filled</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--stamp)">✕</span><span class="cap">rejected</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--ink)">◐</span><span class="cap">partly filled</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--ink-muted)">○</span><span class="cap">idle / pre-open</span></div><div style="display:grid;gap:3px;justify-items:start"><span style="font-size:20px;line-height:1;color:var(--ink-muted)">·</span><span class="cap">unchanged</span></div></div>
</body></html>
