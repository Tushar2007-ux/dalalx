<!-- @dsCard group="Type" viewport="700x230" name="Figures — IBM Plex Mono" subtitle="Every number and price; tabular, lining, slashed zero, Indian grouping" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Mono</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:0;font-family:var(--font-ui)}
.cap{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted)}
.lbl{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
</style></head><body>
<div data-edition="day" class="dx-paper" style="padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:24px">
  <div class="dx-num" style="display:grid;gap:2px;font-size:13px;text-align:right;font-weight:500"><div style="border-bottom:1px dotted var(--rule);padding:2px 0">₹2,481.50</div><div style="border-bottom:1px dotted var(--rule);padding:2px 0">₹912.35</div><div style="border-bottom:1px dotted var(--rule);padding:2px 0">₹1,10,000.00</div><div style="border-bottom:1px dotted var(--rule);padding:2px 0">₹40.05</div><div style="border-bottom:1px dotted var(--rule);padding:2px 0">₹12,40,750.00</div></div>
  <div style="display:grid;gap:8px;align-content:start">
    <div class="dx-num" style="font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:1">02:14</div><span class="cap">countdown · 500 · 40</span>
    <div class="dx-num" style="font-size:22px;font-weight:500">₹2,481.50 <span style="font-size:13px;color:var(--buy)">▲ +12.40 (+0.50%)</span></div><span class="cap">last price · 500 · 22 · change 13</span>
    <span class="cap">font-feature-settings: "tnum","lnum","zero" — digits never shift width</span>
  </div></div>
</body></html>
