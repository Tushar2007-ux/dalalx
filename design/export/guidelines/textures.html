<!-- @dsCard group="Brand" viewport="700x200" name="Paper, grain & hatching" subtitle="Grain at 6–7% opacity; hatched depth fills; no gradients, glows or shadows" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Textures</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:0;font-family:var(--font-ui)}
.cap{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted)}
.lbl{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
</style></head><body>
<div data-edition="day" class="dx-paper" style="padding:14px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
   <div style="display:grid;gap:5px"><div class="dx-paper" style="height:44px;border:1px solid var(--rule)"></div><span class="cap">paper + grain</span></div>
   <div style="display:grid;gap:5px"><div class="dx-hatch" style="height:44px;color:var(--buy);border-right:1.5px solid var(--buy)"></div><span class="cap">.dx-hatch · bid</span></div>
   <div style="display:grid;gap:5px"><div class="dx-hatch" style="height:44px;color:var(--sell);border-right:1.5px solid var(--sell)"></div><span class="cap">.dx-hatch · ask</span></div>
   <div style="display:grid;gap:5px"><div class="dx-hatch" style="height:44px;color:var(--rule)"></div><span class="cap">loading bars</span></div></div><div data-edition="night" class="dx-paper" style="padding:14px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
   <div style="display:grid;gap:5px"><div class="dx-paper" style="height:44px;border:1px solid var(--rule)"></div><span class="cap">paper + grain</span></div>
   <div style="display:grid;gap:5px"><div class="dx-hatch" style="height:44px;color:var(--buy);border-right:1.5px solid var(--buy)"></div><span class="cap">.dx-hatch · bid</span></div>
   <div style="display:grid;gap:5px"><div class="dx-hatch" style="height:44px;color:var(--sell);border-right:1.5px solid var(--sell)"></div><span class="cap">.dx-hatch · ask</span></div>
   <div style="display:grid;gap:5px"><div class="dx-hatch" style="height:44px;color:var(--rule)"></div><span class="cap">loading bars</span></div></div>
</body></html>
