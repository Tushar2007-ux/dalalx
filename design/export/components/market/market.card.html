<!-- @dsCard group="Components" viewport="700x1900" name="Prices, book, tape, chart, countdown" subtitle="Ink-in price states, order-book rows with hatched depth, tape rows, pen chart" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../ds-loader.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
DalalX.ready.then(() => {
const D = DalalX;
const cap = { fontFamily: 'var(--font-mono)', fontSize: 10.5, color: 'var(--ink-muted)' };
const S = ({ l, children, style }) => <div style={{ display: 'grid', gap: 5, alignContent: 'start', ...style }}><span style={cap}>{l}</span>{children}</div>;
const Both = ({ render }) => <div>{['day', 'night'].map((ed) => <D.Edition key={ed} edition={ed} style={{ padding: '14px 20px 18px' }}><div style={{ ...cap, fontFamily: 'var(--font-ui)', fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase', marginBottom: 10 }}>{ed === 'day' ? 'Day edition' : 'Night edition'}</div>{render(ed)}</D.Edition>)}</div>;

function useTicker() {
  const [t, setT] = React.useState({ p: 2481.5, data: [2450, 2456, 2449, 2462, 2470, 2466, 2475, 2481.5], n: 0 });
  React.useEffect(() => { const id = setInterval(() => setT((s) => { const p = Math.round((s.p + (Math.random() - 0.48) * 6) * 20) / 20; return { p, data: s.data.slice(-29).concat(p), n: s.n + 1 }; }), 1100); return () => clearInterval(id); }, []);
  return t;
}
const CANDLES = (() => { let c = 2470; return Array.from({ length: 40 }, (_, i) => { const o = c; c = Math.round((c + (Math.sin(i * 1.7) * 4 + (i % 3 - 1) * 2.5)) * 20) / 20; return { t: '13:' + String(10 + i).padStart(2, '0'), o, c, h: Math.max(o, c) + 1.5 + (i % 4), l: Math.min(o, c) - 1.5 - (i % 3), v: 800 + ((i * 397) % 1600) }; }); })();
function Card() { const t = useTicker(); return <Both render={(ed) => (
  <div style={{ display: 'grid', gap: 16 }}>
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, minmax(0,1fr))', gap: 12 }}>
      <S l="live (ticks 1.1s)"><D.PriceCell value={t.p} size="lg" align="left" /></S>
      <S l="ink=up"><D.PriceCell value={2481.5} ink="up" size="lg" align="left" /></S>
      <S l="ink=down"><D.PriceCell value={2478.25} ink="down" size="lg" align="left" /></S>
      <S l="halted"><D.PriceCell value={1142} halted size="md" align="left" /></S>
      <S l="with change"><D.PriceCell value={2481.5} change={-12.4} changePct={-0.5} showChange align="left" /></S>
    </div>
    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,1.25fr)', gap: 20 }}>
      <div>
        <D.SectionLabel meta="RELNC">Order Book</D.SectionLabel>
        <div style={{ ...cap, display: 'flex', justifyContent: 'space-between', padding: '2px 4px' }}><span>▼ Asks · price</span><span>qty · ord · depth</span></div>
        <D.OrderBookRow side="ask" price={2483.0} qty={4800} orders={2} depth={0.8} flagged />
        <D.OrderBookRow side="ask" price={2482.5} qty={900} orders={3} depth={0.22} />
        <D.OrderBookRow side="ask" price={2482.0} qty={650} orders={2} depth={0.14} best />
        <div className="dx-num" style={{ textAlign: 'center', fontSize: 11, color: 'var(--ink-muted)', padding: '3px 0', borderBottom: '1px solid var(--rule-strong)' }}>spread ₹0.50</div>
        <D.OrderBookRow side="bid" price={2481.5} qty={1200} orders={4} depth={0.3} best hover />
        <D.OrderBookRow side="bid" price={2481.0} qty={120} mine depth={0.05} />
        <D.OrderBookRow side="bid" price={2480.5} qty={2600} orders={6} depth={0.62} />
        <div style={{ ...cap, padding: '3px 4px' }}>▲ Bids · best row hovered · YOU row · ? flagged qty</div>
      </div>
      <div>
        <D.SectionLabel count={4}>Trade Tape</D.SectionLabel>
        <D.TradeTapeRow key={t.n} time={'14:32:' + String(7 + (t.n % 50)).padStart(2, '0') + '.412'} symbol="RELNC" side={t.n % 2 ? 'sell' : 'buy'} price={t.p} qty={120} buyerBot="whale" sellerBot="munim" fresh />
        <D.TradeTapeRow time="14:32:05.118" symbol="RELNC" side="sell" price={2481.0} qty={1200} buyer="Munim" seller="Panic" />
        <D.TradeTapeRow time="14:32:03.940" symbol="RELNC" side="buy" price={2481.5} qty={40} seller="Munim" mine />
        <D.TradeTapeRow time="14:32:01.002" symbol="TATAM" side="sell" price={912.35} qty={300} buyerBot="momentum" sellerBot="spoofer" flagged />
        <div style={{ marginTop: 12 }}><D.PenChart data={t.data} prevClose={2460} width={330} height={120} /></div>
      </div>
    </div>
    <div style={{ height: 300 }}><D.CandleChart candles={CANDLES} prevClose={2460} interval="5m" /></div>
    <S l="breadth"><D.BreadthBar advancing={3} declining={1} halted={1} /></S>
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, minmax(0,1fr))', gap: 12, borderTop: '1px solid var(--rule)', paddingTop: 10 }}>
      <D.Countdown seconds={2534} size="sm" />
      <D.Countdown seconds={48} size="sm" />
      <D.Countdown seconds={7} size="sm" />
      <D.Countdown seconds={0} size="sm" />
    </div>
  </div>)} />; }
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
});
</script></body></html>
