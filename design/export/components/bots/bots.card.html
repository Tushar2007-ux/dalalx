<!-- @dsCard group="Components" viewport="700x1560" name="Bot bylines" subtitle="All six bots as byline cards, both editions; compact rows with head-crop avatars" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../ds-loader.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
DalalX.ready.then(() => {
const D = DalalX;
const cap = { fontFamily: 'var(--font-mono)', fontSize: 10.5, color: 'var(--ink-muted)' };
const S = ({ l, children, style }) => <div style={{ display: 'grid', gap: 5, alignContent: 'start', ...style }}><span style={cap}>{l}</span>{children}</div>;
const Both = ({ render }) => <div>{['day', 'night'].map((ed) => <D.Edition key={ed} edition={ed} style={{ padding: '14px 20px 18px' }}><div style={{ ...cap, fontFamily: 'var(--font-ui)', fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase', marginBottom: 10 }}>{ed === 'day' ? 'Day edition' : 'Night edition'}</div>{render(ed)}</D.Edition>)}</div>;

const ROSTER = [
  ['munim', 'active', [{ label: 'P&L today', value: '₹4,210', dir: 'up' }, { label: 'Spread', value: '₹0.50' }, { label: 'Quotes', value: '1,882' }, { label: 'Inventory', value: '+340' }]],
  ['momentum', 'active', [{ label: 'P&L today', value: '₹1,960', dir: 'up' }, { label: 'Hit rate', value: '54%' }, { label: 'Trades', value: '211' }, { label: 'Position', value: '+1,200' }]],
  ['panic', 'active', [{ label: 'P&L today', value: '₹8,730', dir: 'down' }, { label: 'Sold', value: '12,000' }, { label: 'Trades', value: '96' }, { label: 'Position', value: '−4,300' }]],
  ['whale', 'idle', [{ label: 'P&L today', value: '₹22,400', dir: 'up' }, { label: 'Avg block', value: '40,000' }, { label: 'Blocks', value: '3' }, { label: 'Position', value: '+1,10,000' }]],
  ['spoofer', 'flagged', [{ label: 'P&L today', value: '₹610', dir: 'up' }, { label: 'Cancel rate', value: '94%' }, { label: 'Orders', value: '3,410' }, { label: 'Fills', value: '18' }]],
  ['inspector', 'duty', [{ label: 'Cases open', value: '2' }, { label: 'Flags today', value: '7' }, { label: 'Suspensions', value: '1' }, { label: 'Tape read', value: '100%' }]],
];
function Card() { return <Both render={(ed) => (
  <div style={{ display: 'grid', gap: 18 }}>
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: '18px 20px' }}>
      {ROSTER.map(([b, st, stats]) => <D.BotByline key={b} bot={b} status={st} stats={stats} portraitSize={150} />)}
    </div>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 20px' }}>
      {ROSTER.map(([b, st, stats], i) => <D.BotByline key={b} bot={b} layout="compact" status={i === 2 ? 'halted' : st} stats={[stats[0]]} hover={i === 0} onClick={() => {}} />)}
    </div>
  </div>)} />; }
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
});
</script></body></html>
