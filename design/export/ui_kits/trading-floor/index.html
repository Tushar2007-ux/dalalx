<!-- @dsCard group="Trading Floor" viewport="1440x900" name="Trading floor" subtitle="Full DalalX terminal: masthead, markets, book, tape, ticket, surveillance" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>DalalX · Trading Floor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../ds-loader.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
DalalX.ready.then(() => {
const D = DalalX;
const BOTN = { munim: 'Munim', momentum: 'Momentum', panic: 'Panic', whale: 'Whale', spoofer: 'Spoofer' };
const SYMS = { RELNC: 2481.5, TATAM: 912.35, INFOS: 1534.2, HDFCB: 1688.0, ADANI: 3021.75 };
const r05 = (x) => Math.round(x * 20) / 20;
const fmt = (n) => n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const clock = (d) => d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');

function book(mid, spoof) {
  const asks = [], bids = [];
  for (let i = 4; i >= 0; i--) asks.push({ price: r05(mid + 0.5 + i * 0.5), qty: Math.round(200 + Math.random() * 1800), orders: 1 + Math.floor(Math.random() * 6) });
  for (let i = 0; i < 5; i++) bids.push({ price: r05(mid - i * 0.5), qty: Math.round(200 + Math.random() * 1800), orders: 1 + Math.floor(Math.random() * 6) });
  if (spoof) { bids[3].qty = 48000; bids[3].flagged = true; bids[4].qty = 52000; bids[4].flagged = true; }
  const max = Math.max(...asks.concat(bids).map((r) => r.qty));
  asks.concat(bids).forEach((r) => (r.depth = r.qty / max));
  return { asks, bids };
}

function useMarket() {
  const [m, setM] = React.useState(() => ({
    px: { ...SYMS }, prev: { ...SYMS }, hist: { RELNC: [2470, 2474, 2468, 2477, 2480, 2479, 2481.5] }, tape: [], n: 0, spoof: false,
  }));
  React.useEffect(() => {
    const id = setInterval(() => setM((s) => {
      const px = { ...s.px };
      Object.keys(px).forEach((k) => { if (k !== 'ADANI') px[k] = r05(px[k] * (1 + (Math.random() - 0.49) * 0.0016)); });
      const names = Object.keys(BOTN);
      const sym = Math.random() < 0.6 ? 'RELNC' : ['TATAM', 'INFOS', 'HDFCB'][Math.floor(Math.random() * 3)];
      const b = names[Math.floor(Math.random() * 5)], sl = names[(names.indexOf(b) + 1 + Math.floor(Math.random() * 4)) % 5];
      const t = { id: s.n, time: clock(new Date()), symbol: sym, side: px[sym] >= s.px[sym] ? 'buy' : 'sell', price: px[sym], qty: 10 * Math.ceil(Math.random() * 60), buyer: BOTN[b], seller: BOTN[sl], flagged: s.spoof && (b === 'spoofer' || sl === 'spoofer') };
      const hist = { RELNC: s.hist.RELNC.slice(-59).concat(px.RELNC) };
      return { ...s, px, hist, tape: [t].concat(s.tape).slice(0, 14), n: s.n + 1, spoof: s.spoof || s.n === 14 };
    }), 900);
    return () => clearInterval(id);
  }, []);
  return [m, setM];
}

const PREV = { RELNC: 2460.0, TATAM: 920.1, INFOS: 1528.0, HDFCB: 1683.25, ADANI: 3085.4 };

function Ticket({ px, onConfirm, stamp }) {
  const [side, setSide] = React.useState('buy');
  const [type, setType] = React.useState('limit');
  const [price, setPrice] = React.useState(fmt(px));
  const [qty, setQty] = React.useState('120');
  const p = parseFloat(String(price).replace(/,/g, '')) || 0;
  const err = type !== 'market' && (p > px * 1.1 || p < px * 0.9) ? "Outside today's circuit band" : null;
  const val = (type === 'market' ? px : p) * (parseInt(qty) || 0);
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr)', gap: 12, position: 'relative' }}>
      <D.SideToggle value={side} onChange={setSide} />
      <D.OrderTypeToggle value={type} onChange={setType} />
      <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,1fr)', gap: 10 }}>
        <D.PriceInput label="Limit price" prefix="₹" value={type === 'market' ? 'Market' : price} onChange={setPrice} disabled={type === 'market'} error={err} hint={type === 'market' ? 'Best available' : 'Band ₹' + fmt(px * 0.9) + '–' + fmt(px * 1.1)} />
        <D.PriceInput label="Quantity" suffix="qty" value={qty} onChange={setQty} inputMode="numeric" hint="Lot size 1" />
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: 'var(--ink-muted)', borderTop: '1px solid var(--rule)', paddingTop: 8 }}>
        <span>Order value</span><span className="dx-num" style={{ color: 'var(--ink)', fontSize: 13 }}>₹{fmt(val)}</span>
      </div>
      <D.Button variant={side === 'sell' ? 'danger' : 'primary'} fullWidth size="lg" disabled={!!err || !(parseInt(qty) > 0)} kbd="↵"
        onClick={() => onConfirm({ side, type, qty: parseInt(qty), price: type === 'market' ? px : p })}>
        {side === 'buy' ? '▲ Buy' : '▼ Sell'} {qty} RELNC
      </D.Button>
      {stamp && <D.RubberStamp kind="filled" sub={stamp} animate slamKey={stamp} angle={-5} style={{ position: 'absolute', right: 6, top: 54 }} backed />}
    </div>
  );
}

function App() {
  const forced = new URLSearchParams(location.search).get('edition');
  const [ed, setEd] = React.useState(() => forced || localStorage.getItem('dalalx-edition') || 'day');
  const [sym, setSym] = React.useState('RELNC');
  const [m] = useMarket();
  const [confirm, setConfirm] = React.useState(null);
  const [toasts, setToasts] = React.useState([]);
  const [stamp, setStamp] = React.useState(null);
  const [seen, setSeen] = React.useState(false);
  React.useEffect(() => { if (!forced) localStorage.setItem('dalalx-edition', ed); }, [ed]);
  const EDN = { day: 'Day Edition', night: 'Night Edition', midnight: 'Night · Midnight Ink', charcoal: 'Night · Charcoal Press', 'pink-night': 'Night · Pink Night' };
  const px = m.px.RELNC;
  const bk = React.useMemo(() => book(px, m.spoof), [px, m.spoof]);
  const tabs = Object.keys(SYMS).map((k) => ({ symbol: k, change: k === 'ADANI' ? -2.06 : ((m.px[k] - PREV[k]) / PREV[k]) * 100, halted: k === 'ADANI' }));
  const fill = () => {
    const o = confirm; setConfirm(null);
    const t = clock(new Date()).slice(0, 8);
    setStamp(t + ' · ' + o.qty + ' @ ' + fmt(o.price));
    setToasts((x) => [{ id: Date.now(), kind: 'filled', title: (o.side === 'buy' ? 'Bought ' : 'Sold ') + o.qty + ' RELNC at ₹' + fmt(o.price), detail: '#A-' + (2291 + x.length) + ' · ' + o.type.toUpperCase() + ' · ₹' + fmt(o.qty * o.price), time: t }].concat(x).slice(0, 3));
  };
  const headline = m.spoof
    ? { kicker: 'Stop Press', state: 'breaking', tone: 'down', headline: 'Surveillance flags layered bids in RELNC; The Spoofer under review', time: m.tape[0] ? m.tape[0].time.slice(0, 8) : clock(new Date()).slice(0, 8) }
    : { kicker: 'Latest', state: 'live', tone: px >= PREV.RELNC ? 'up' : 'down', headline: px >= PREV.RELNC ? 'RELNC holds above ₹' + fmt(Math.floor(px / 10) * 10) + ' as The Munim tightens quotes' : 'RELNC slips under yesterday\'s close', time: m.tape[0] ? m.tape[0].time.slice(0, 8) : clock(new Date()).slice(0, 8) };
  const col = { minWidth: 0, padding: '0 10px' };
  return (
    <D.Edition edition={ed} style={{ minHeight: '100vh', padding: '0 24px 32px', boxSizing: 'border-box' }}>
      <D.Masthead editionName={EDN[ed] || 'Night Edition'} rightMeta={
        <span style={{ display: 'inline-flex', gap: 14, alignItems: 'center' }}>Paper money only
          <button onClick={() => setEd(ed === 'day' ? 'night' : 'day')} className="dx-focus" style={{ appearance: 'none', background: 'none', border: '1px solid var(--rule-strong)', color: 'var(--ink)', font: 'inherit', padding: '2px 8px', cursor: 'pointer' }}>{ed === 'day' ? 'Night edition →' : 'Day edition →'}</button>
        </span>} />
      <D.HeadlineBanner {...headline} />
      <div style={{ marginTop: 14 }}><D.StockTabs tabs={tabs} value={sym} onChange={setSym} /></div>

      <div style={{ display: 'flex', flexWrap: 'wrap', rowGap: 24, marginTop: 14 }}>
        <D.RuledPanel label="Markets" meta="Simulated" style={{ ...col, flex: '0.85 1 220px', paddingLeft: 0 }}>
          {Object.keys(SYMS).map((k) => (
            <div key={k} style={{ display: 'grid', gridTemplateColumns: '1fr auto', alignItems: 'baseline', padding: '6px 0', borderBottom: '1px solid var(--rule)' }}>
              <span style={{ fontWeight: 600, fontSize: 12.5, letterSpacing: '0.04em' }}>{k}</span>
              <D.PriceCell value={m.px[k]} halted={k === 'ADANI'} />
              <span />
              <D.PriceCell value={m.px[k]} change={m.px[k] - PREV[k]} changePct={((m.px[k] - PREV[k]) / PREV[k]) * 100} changeOnly size="sm" style={{ visibility: k === 'ADANI' ? 'hidden' : 'visible' }} />
            </div>
          ))}
          <div style={{ marginTop: 16 }}><D.Countdown endsAt={window.__bell || (window.__bell = Date.now() + 754000)} /></div>
        </D.RuledPanel>

        <D.RuledPanel label="RELNC" meta="Intraday" columnRule="left" style={{ ...col, flex: '1.6 1 420px' }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, margin: '6px 0 10px' }}>
            <D.PriceCell value={px} size="xl" prefix="₹" align="left" />
            <D.PriceCell value={px} change={px - PREV.RELNC} changePct={((px - PREV.RELNC) / PREV.RELNC) * 100} changeOnly size={20} align="left" />
          </div>
          <D.PenChart data={m.hist.RELNC} prevClose={PREV.RELNC} height={170} />
          <div style={{ marginTop: 14 }}>
            <D.SectionLabel count={m.tape.length} meta="Newest first">Trade Tape</D.SectionLabel>
            {m.tape.slice(0, 9).map((t, i) => <D.TradeTapeRow key={t.id} {...t} fresh={i === 0} />)}
          </div>
        </D.RuledPanel>

        <D.RuledPanel label="Order Book" meta="5 levels" columnRule="left" style={{ ...col, flex: '1 1 300px' }}>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, color: 'var(--ink-muted)', padding: '2px 4px' }}>▼ Asks</div>
          {bk.asks.map((r, i) => <D.OrderBookRow key={'a' + i} side="ask" {...r} best={i === 4} />)}
          <div className="dx-num" style={{ textAlign: 'center', fontSize: 11, color: 'var(--ink-muted)', padding: '3px 0', borderBottom: '1px solid var(--rule-strong)' }}>spread ₹0.50</div>
          {bk.bids.map((r, i) => <D.OrderBookRow key={'b' + i} side="bid" {...r} best={i === 0} />)}
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, color: 'var(--ink-muted)', padding: '3px 4px' }}>▲ Bids</div>
          {m.spoof && <div style={{ marginTop: 8 }}><D.MarginNote author="Inspector" time={headline.time}>Two outsized bids, cancelled and re-entered every second. Watching.</D.MarginNote></div>}
        </D.RuledPanel>

        <D.RuledPanel label="Order Ticket" meta="RELNC" columnRule="left" style={{ ...col, flex: '1 1 300px', paddingRight: 0 }}>
          <Ticket px={px} stamp={stamp} onConfirm={setConfirm} />
          <div style={{ marginTop: 18 }}>
            <D.SectionLabel meta={m.spoof ? <span style={{ color: 'var(--pencil-text)' }}>◆ 1 case open</span> : 'All quiet'}>Surveillance</D.SectionLabel>
            {m.spoof && !seen && <div style={{ margin: '6px 0 10px' }}><D.AlertNotice severity="critical" fresh title="The Spoofer under investigation" reference="SV-0412" time={headline.time} onDismiss={() => setSeen(true)}>Bids of <D.RedPencilCircle label="Flagged">48,000</D.RedPencilCircle> and 52,000 cancelled within 0.4s, nine times.</D.AlertNotice></div>}
            {['munim', 'whale', 'spoofer', 'inspector'].map((b) => <D.BotByline key={b} bot={b} layout="compact" status={b === 'spoofer' && m.spoof ? 'flagged' : b === 'inspector' ? 'duty' : b === 'whale' ? 'idle' : 'active'} stats={[{ label: b === 'inspector' ? 'Cases' : 'P&L', value: b === 'inspector' ? (m.spoof ? '1' : '0') : b === 'munim' ? '₹4,210' : b === 'whale' ? '₹22,400' : '₹610', dir: b === 'inspector' ? undefined : 'up' }]} />)}
          </div>
        </D.RuledPanel>
      </div>

      <div aria-live="polite" style={{ position: 'fixed', top: 16, right: 16, display: 'grid', gap: 8, zIndex: 40 }}>
        {toasts.map((t) => <D.Toast key={t.id} {...t} onClose={() => setToasts((x) => x.filter((y) => y.id !== t.id))} />)}
      </div>
      <D.Modal open={!!confirm} kicker="Confirm order" title={confirm ? (confirm.side === 'buy' ? 'Buy ' : 'Sell ') + confirm.qty + ' RELNC' + (confirm.type === 'market' ? ' at market?' : ' at ₹' + fmt(confirm.price) + '?') : ''} onClose={() => setConfirm(null)}
        actions={<><D.Button variant="secondary" onClick={() => setConfirm(null)}>Keep editing</D.Button><D.Button variant={confirm && confirm.side === 'sell' ? 'danger' : 'primary'} onClick={fill}>{confirm && confirm.side === 'sell' ? '▼ Sell' : '▲ Buy'}</D.Button></>}>
        {confirm && <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: '4px 16px' }}>
          <span style={{ color: 'var(--ink-muted)' }}>Type</span><span>{confirm.type === 'ioc' ? 'IOC' : confirm.type[0].toUpperCase() + confirm.type.slice(1)}</span>
          <span style={{ color: 'var(--ink-muted)' }}>Estimated value</span><span className="dx-num">₹{fmt(confirm.qty * confirm.price)}</span>
        </div>}
      </D.Modal>
    </D.Edition>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
